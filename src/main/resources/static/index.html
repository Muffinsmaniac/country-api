<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A title</title>
</head>
<body>

    <div class="container">
        <h2>The World</h2>

        <div class="left">

            <label for="region">Filter by region:</label>
            <select name="region" id="region">
                <option value="all">All</option>
                <option value="Americas">Americas</option>
                <option value="Africa">Africa</option>
                <option value="Asia">Asia</option>
                <option value="Europe">Europe</option>
                <option value="Oceania">Oceania</option>
            </select>
            <label>Sort By:</label>
            <button id="nameButton">Name</button>
            <button id="popButton">Population</button>
            <label for="directionButton">Toggle:</label>
            <button id="directionButton">Ascending</button>
            <section class="lan">
                <h3>Countries</h3>
                <nav id="mainnav">
                    <ul id="mainnavlist" style="list-style-type: none"></ul>
                </nav>
            </section>
            <button id="prevButton">Prev</button>
            <button id="nextButton">Next</button>
        </div>


        <div class="right">
            <div id="info"></div>

        </div>
    </div>


    <script src="js/main.js"></script>
</body>
</html>
